<html>
    <head>
        <style>
            .a{
                width:100px;
                height: 100px;
                background-color: aqua;
                transform: translateX(100px);
            }
            .a1{
                width:100px;
                height: 100px;
                background-color: aqua;
                transform: translateX(-100px);
            }
            .b{
                width:100px;
                height: 100px;
                background-color: rgb(255, 0, 195);
                transform: translateY(200px);
            }
            .b1{
                width:100px;
                height: 100px;
                background-color: rgb(166, 197, 92);
                transform: translateY(-100px);
            }
            .a2{
                width:100px;
                height: 100px;
                background-color: rgb(197, 159, 92);
                transform: skewX(60deg);
            }
            .a21{
                width:100px;
                height: 100px;
                background-color: rgb(237, 97, 104);
                transform: skewY(60deg);
            }
            .c{
                width: 100px;
                height: 100px;
                background-color: black;
                transform: scaleX(30);
            }
            .c1{
                width: 100px;
                height: 100px;
                background-color: rgb(199, 61, 61);
                transform: scaleY(20);
            }
            .d{
                width: 100px;
                height: 100px;
                background-color: black;
                transform: rotateX(100deg);
            }
            .d1{
                width: 100px;
                height: 100px;
                background-color: black;
                transform: rotateY(100deg);
            }
        </style>
    </head>
    <body>
        <!--Translate-->
        <div class="a"></div>
        <div class="a1"></div>
        <div class="b"></div>
        <div class="b1"></div><br><br><br><br><br><br>
        <!--Skew-->
        <div class="a2"></div>
        <div class="a21"></div>
        <!--Scale-->
        <div class="c"></div>
        <div class="c1"></div>
        <!--rotate-->
        <div class="d"></div>
        <div class="d1"></div>
    </body>
</html>
