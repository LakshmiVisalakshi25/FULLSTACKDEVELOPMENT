<html>
    <head>
        <title></title>
    </head>
    <body>
        <h1>Travel Reservation Form</h1>
        <h4>* denotes Mandatory</h4>
        <label>Full name*:</label><br><br>
        <input type="text" placeholder="Firstname Lastname"><br><br>
        <label>Email address*:</label><br><br>
        <input type="email" placeholder="EMAIL_ADDRESS"><br><br>
        <label>Select Tour Package*:</label><br><br>
        <select><option>Goa</option></select><br><br>
        <label>Arrival date*:</label><br><br>
        <input type="date" placeholder="m/d/y"><br><br>
        <label>Number of Persons*:</label><br><br>
        <input type="number" placeholder="UNKNOWN_TYPE"><br><br>
        <label>What would you want to avail?*:</label><br>
        Boarding<input type="checkbox"><br>
        Fooding<input type="checkbox"><br>
        Sight seeing<input type="checkbox"><br><br>
        <label>Discount Coupon Code:</label><br>
        <input type="text" placeholder="UNKNOWN_TYPE"><br><br>
        <label>Terms and conditions*:</label><br>
        <input type="radio">I agree <input type="radio">I disagree<br><br>
        <button>Complete reservation</button>
    </body>
</html>
