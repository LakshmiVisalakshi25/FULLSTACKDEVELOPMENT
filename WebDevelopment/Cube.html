<html>
    <head>
        <style>
            body{
                display: flex;
                justify-content: center;
                align-items: center;
                perspective: 1000px;
                background-color: rgba(111, 113, 114, 0.92);
            }
            @keyframes myanimation {
                100%{
                    transform: rotateX(360deg) rotateY(360deg);
                }
            }
            .cube{
                width:250px;
                height: 250px;
                /* border:1px solid aqua; */
                animation: myanimation 5s infinite linear;
                position: relative;
                transform-style: preserve-3d;
            }
            .cube div{
                position: absolute;
                width:250px;
                height: 250px;
                /* background-color: rgb(154, 238, 238); */
                border: 1px solid black;
                opacity: 0.5;
            }
            .left{
                transform: rotateY(90deg) translateZ(125px);
                background-color: blueviolet;
            }
            .right{
                transform: rotateY(90deg) translateZ(-125px);
                background-color: rgb(248, 12, 91);
            }
            .top{
                transform: rotateX(90deg) translateZ(125px);
                background-color: rgb(12, 170, 233);
            }
            .bottom{
                transform: rotateX(-90deg) translateZ(125px);
                background-color: green;
            }
            .front{
                transform: translateZ(-125px);
                background-color: teal;
            }
            .back{
                transform: translateZ(125px);
                background-color: brown;
            }
        </style>
    </head>
    <body>
        <div class="cube">
            <div class="left"></div>
            <div class="right"></div>
            <div class="top"></div>
            <div class="bottom"></div>
            <div class="front"></div>
            <div class="back"></div>
        </div>
    </body>
</html>
