<html>
    <head>
        <title>Table</title>
    </head>
    <body>
        <table border="2">
            <tr>
                <td>S.NO</td>
                <td>Name</td>
                <td>Age</td>
                <td>Marks</td>
            </tr>
            <tr>
                <td>1</td>
                <td>Ankitha</td>
                <td>19</td>
                <td>98</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Prabha</td>
                <td>20</td>
                <td>90</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Reshma</td>
                <td>21</td>
                <td>80</td>
            </tr>
        </table>
        <h1>Table With thead and tbody</h1>
        <table border="2">
            <thead>
            <tr>
                <th>S.NO</th>
                <th>Name</th>
                <th>Age</th>
                <th>Marks</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td>1</td>
                <td>Ankitha</td>
                <td>19</td>
                <td>98</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Prabha</td>
                <td>20</td>
                <td>90</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Reshma</td>
                <td>21</td>
                <td>80</td>
            </tr>
            </tbody>
        </table>
        <h1>Table with colspan and rowspan</h1>
        <table border="2">
            <tr>
                <th rowspan="2">S.NO</th>
                <th colspan="3">Engineering</th>
                <th colspan="2">Degree</th>
            </tr>
            <tr>
                <th>AEC</th>
                <th>ACET</th>
                <th>ACOE</th>
                <th>B.SC</th>
                <th>BCOM</th>
            </tr>
            <tr>
                <td>1</td>
                <td>100</td>
                <td>30</td>
                <td>50</td>
                <td>20</td>
                <td>80</td>
            </tr>
            <tr>
                <td>2</td>
                <td>90</td>
                <td>30</td>
                <td>30</td>
                <td>10</td>
                <td>90</td>
            </tr>
            <tr>
                <td>3</td>
                <td>80</td>
                <td>50</td>
                <td>50</td>
                <td>70</td>
                <td>80</td>
            </tr>
        </table>
    </body>
</html>
