<html>
    <head>
        <style>
            .a{
                width:300px;
                height: 300px;
                background-color: aqua;
            }
            .a:hover{
                background-color: blue;
                border-radius: 50px;
            }
            button:active{
                background-color:red;
            }
            input:focus{
                background-color: blueviolet;
            }
            .parent :nth-child(1){
                color: red;
            }
            p:not(.parent){
                color:pink
            }
        </style>
    </head>
    <body>
        <div class="a"></div>
        <button type="button">Submit</button>
        <input type="text">
        <div class="parent">
            <h1>1</h1>
            <h2>2</h2>
            <h3>3</h3>
        </div>
        <p>Hello</p>
    </body>
</html>
