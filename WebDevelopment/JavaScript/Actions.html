<html>
    <head>
        <script>
            function fun(){
                console.log("Hi");
            }
        </script>
    </head>
    <body>
        <button onclick="console.log('Hello');">Click Me</button>
        <button ondblclick="fun()">Click Me</button>
        <button onmouseenter="fun()">Mouse Enter</button>
        <button onmouseleave="fun()">Mouse Leave</button> 
        <button onmouseover="console.log('Over');">Mouse Over</button>
        <button onmousemove="console.log('Move')">Mouse Move</button>
        <button onmouseout="console.log('Out')">Mouse Out</button>
    </body>
</html>
