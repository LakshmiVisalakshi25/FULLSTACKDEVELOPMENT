<html>
    <head>
        <title>Menu</title>
        <style>
            .a{
                width: 200px;
                height: 100%;
                background-color: rgb(228, 236, 244);
                display: flex;
                flex-direction: column;
                position: absolute;
                left:-200px;
                align-items: end;
                top:0px;
                transition: left 0.8s linear;
            }
            .a div{
                width: 100%;
                padding: 10px 0px;
                border-bottom: 2px solid black;
            }
            span {
                font-size: 35px;
                max-width: fit-content;
                
            } 
            .a div:hover{
                background-color: black;
                color: white;
            }
        </style>
    </head>
    <body>
        <div onclick="Open()">&#9776;</div>
        <div class="a">
            <span onclick="Close()">&times;</span>
            <div>Home</div>
            <div>About</div>
            <div>Pricing</div>
            <div>Contact</div>
        </div>
        <script>
            function Close(){
                document.getElementsByClassName("a")[0].style="left:-200px"
            }
            function Open(){
                document.getElementsByClassName("a")[0].style="left:0px;top:0px"
            }
        </script>
    </body>
</html>
